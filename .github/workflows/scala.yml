name: Docker Build and Push

on:
  push:
    branches: [ "1.8.8" ]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Java项目构建步骤（根据实际情况调整）
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -B

      # 将构建产物复制到Docker上下文目录
      - name: Prepare Docker context
        run: |
          mkdir -p sentinel-dashboard
          cp target/sentinel-dashboard.jar sentinel-dashboard/

      # 配置多平台构建环境
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Docker Hub认证
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 多平台构建及推送
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: sentinel-dashboard
          file: sentinel-dashboard/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: fjy8018/sentinel:latest
          tag_with_ref: true  # 自动添加Git引用标签（如tag版本）