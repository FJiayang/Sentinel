name: Build and Push Sentinel Dashboard Docker Image

on:
  push:
    branches:
      - '1.8.*'
  pull_request:
    branches:
      - '1.8.*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }} # 在GitHub Secrets中设置DOCKER_USERNAME
          password: ${{ secrets.DOCKER_PASSWORD }} # 在GitHub Secrets中设置DOCKER_PASSWORD

      - name: Set up QEMU for multi-architecture builds
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: sentinel-dashboard
          file: sentinel-dashboard/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: fjy8018/sentinel:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
          build-args: PARAM=${{ env.PARAM }},VERSION=${{ env.VERSION }}

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache